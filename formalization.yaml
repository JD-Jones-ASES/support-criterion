version: v0.4

project:
  name: Sharp universal support criterion for sub-Gaussian laws
  description: >-
    For every Borel probability law on the real line that is symmetric about
    zero and satisfies 0 < a <= |X| <= b almost surely, the support ratio
    b/a <= sqrt(3) + sqrt(2) guarantees E exp(t X) <= exp(t^2 E X^2 / 2)
    for every real t. The inequality is strict for nonzero t, and the actual
    variance is the optimal quadratic proxy. An explicit symmetric law on
    {-R,-1,1,R} violates the bound near zero for each larger ratio R.
    In the normalization 3-sqrt(6) <= X^2 <= 3+sqrt(6), the development
    also establishes the sharp eighth-order MGF gap with its optimal
    interiority coefficient, identifies the unique law with Gaussian
    fourth-moment contact, and proves the sharp global Wasserstein bound
    for the squared law at every feasible fourth-cumulant deficit, including
    attainment. The proof combines a convex endpoint reduction, control of
    the entire moment tail, exact rational Bernstein certificates, and an
    explicit affine transport coupling.
  authors:
    - JD Jones
  responsible_maintainers:
    - JD Jones
  license: MIT

classification:
  arxiv: [math.PR]
  msc2020: [60E15, 60E05]

status:
  scope: >-
    The five principal groups are the universal support criterion with proxy
    optimality, ratio sharpness, quantitative MGF separation, fourth-moment
    rigidity, and sharp global stability for squared laws with attainment.
    The independent Challenge also records the semantics of its ordinary
    probability and transport definitions. Exact-commit Linux verification
    is recorded in VERIFICATION.md.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]

sources:
  - title: Sharp universal support criterion
    type: original-proof
    relationship: other
    location: Proof.md
    note: The mathematical statement and proof are presented in this repository.
  - title: On strict sub-Gaussianity, optimal proxy variance and symmetry for bounded random variables
    type: paper
    relationship: background
    authors: [Julyan Arbel, Olivier Marchal, Hien D. Nguyen]
    id: https://arxiv.org/pdf/1901.09188v1
    note: Propositions 3.2 and 3.3 give cumulant necessity and momentwise sufficiency.
  - title: Strictly subgaussian probability distributions
    type: paper
    relationship: background
    authors: [Sergey G. Bobkov, Gennadiy P. Chistyakov, Friedrich Götze]
    id: https://arxiv.org/pdf/2308.01749v1
    note: Proposition 2.4 concerns mixtures whose components have equal variance.
  - title: Polynomial methods in statistical inference, theory and practice
    type: paper
    relationship: background
    authors: [Yihong Wu, Pengkun Yang]
    id: https://arxiv.org/pdf/2104.07317v2
    note: Section 2.7.1, Lemma 2.7.3 in the pinned PDF establishes Gaussian-quadrature sub-Gaussianity.
  - title: Operator inequalities related to Cauchy-Schwarz and Hölder-McCarthy inequalities
    type: paper
    relationship: background
    authors: [M. Fujii, S. Izumino, R. Nakamoto, Y. Seo]
    id: https://www.researchgate.net/publication/254210690_Operator_Inequalities_Related_To_Cauchy-Schwarz_And_Holder-McCarthy_Inequalities
    note: Records the classical Kantorovich moment inequality underlying the fourth-moment obstruction.

automation:
  methods:
    - method: agent
      models: [GPT-6 Astra, GPT-6 Pro]
      framework: OpenAI Codex
      tool_setup: OpenAI Codex with GPT-6 Astra; Lean 4 and Mathlib at committed revisions.
      notes: >-
        Agents developed the proof, generated exact rational certificate data,
        implemented the Lean development, checked primary sources, and reviewed
        the statements. A GPT-6 Pro consultation supplied the sharp-gap and
        global-transport arguments; Codex agents independently checked and
        formalized the extensions. Lean checks the generated identities and inequalities;
        Python execution is not a proof premise. Disclosure.md gives the
        production account. Verification commands and exact-commit records are
        maintained separately.

review:
  status: agent-reviewed
  reviewers: [OpenAI Codex agents]
  notes: >-
    Separate internal agent reviews checked the written mathematics, source
    comparisons, and formal interfaces. Mechanical verification status is
    recorded in VERIFICATION.md. No human specialist review is asserted.

limitations:
  - The older intrinsic-deficit bound is retained; its numerical coefficients are not asserted optimal.
  - The general interval transport theorem, equality classification, and higher Wasserstein orders are written supplements.
  - The unsquared-law transport prefactor is not asserted optimal.
  - Conditional concentration and optimized local worst-law asymptotics are explanatory supplements.
